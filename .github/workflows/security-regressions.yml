name: Security regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['14.21.3', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix tests/dependency-security --ignore-scripts
      - run: NODE_PATH="$PWD/tests/dependency-security/node_modules" npm test --prefix tests/dependency-security
  source-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tests/security/mongo-key.test.cjs
      - run: |
          python3 -m venv .security-doc-venv
          .security-doc-venv/bin/pip install -r docs/requirements.txt
          .security-doc-venv/bin/python tests/security/docs-integrity.py
